# ===================================================================
# Traffic Sign Recognition & Road Safety Monitor - Configuration
# ===================================================================

app.name=Traffic Sign Recognition and Road Safety Monitor
app.version=1.0.0-SNAPSHOT
app.environment=development

# Server Settings (for upcoming Web Interface module)
server.port=8080
server.host=127.0.0.1

# Dataset Configuration
data.raw.dir=data/raw
data.processed.dir=data/processed
data.splits.dir=data/splits
data.image.target_width=32
data.image.target_height=32
data.image.channels=3
data.random_seed=42

# Model and Inference Settings
model.active_engine=baseline_mlp
model.checkpoints.dir=models/checkpoints
model.exported.dir=models/exported
model.confidence_threshold=0.60
model.uncertainty_warning_threshold=0.75

# Evaluation & Experiment Tracking
experiments.log_dir=experiments
results.output_dir=results
