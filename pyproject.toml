[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficsign"
version = "1.0.0"
description = "Indian Traffic Sign Recognition and Road Safety Decision-Support Monitor"
authors = [{ name = "baalakAugustya" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pytest>=7.4.0",
]

[project.scripts]
trafficsign-demonstrator = "trafficsign.app.demonstrator:main"
trafficsign-audit = "trafficsign.app.audit_runner:main"
trafficsign-monitor = "trafficsign.ui.app:main"
